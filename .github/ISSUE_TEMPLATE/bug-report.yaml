name: Bug report
description: Something in Lagoon does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please do not include server addresses, user names, API keys
        or anything else private; issues are public.
  - type: checkboxes
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and this has not been reported yet.
          required: true
        - label: The problem also happens on the latest Lagoon release.
          required: true
  - type: textarea
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a series from Continue watching
        2. Press Play
        3. ...
    validations:
      required: true
  - type: input
    attributes:
      label: Lagoon version
      description: Shown in Preferences > About.
    validations:
      required: true
  - type: input
    attributes:
      label: Device
      placeholder: Chromecast with Google TV (4K), Android TV 12
    validations:
      required: true
  - type: input
    attributes:
      label: Jellyfin server version
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs or screenshots
      description: Optional. Remove anything private before attaching.
