name: Feature request
description: Suggest an improvement to Lagoon
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What would you like Lagoon to do?
      description: Describe the problem you want solved before the solution you have in mind.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How would it work with a remote?
      description: Lagoon is driven with a D-pad. Describe the key presses where you can.
